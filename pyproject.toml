[project]
name = "proyecto-1-esp-data"
version = "0.1.0"
description = "Predicción de días con mala calidad del aire en Beijing (PM2.5 > 75 µg/m³ mañana)"
readme = "README.md"
authors = [
    { name = "Valentina", email = "valentinarestrepoarboleda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139,<0.151",
    "joblib>=1.4",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=2.2,<3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]



[tool.pytest.ini_options]
testpaths = ["tests"]
